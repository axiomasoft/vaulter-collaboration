name: CI

# DAG (GitHub draws this from `needs`):
#   changes → quality → { php, mysql, node, image-template, e2e, stand } → CI gate
#
# quality is the fast fail: stop-cranes, composer validate, Pint, PHPStan, Rector,
# the hub typecheck, actionlint and zizmor. The heavier lanes only start after it
# succeeds. Path filters skip unaffected lanes on feature branches; a push to main,
# workflow_dispatch, or a change under .github/ always runs every lane.
# `CI gate` is the single check a branch rule should require (skipped lanes are allowed).
#
# Siblings (../vaulter, ../packman) come from scripts/ci/checkout-ecosystem.sh.
# VAULTER_READ_TOKEN is optional now that those repositories are public; when set,
# it is sent as an HTTP header (never in a URL). Stop-cranes (scripts/ci/stop-cranes.py)
# enforce the Zero-Royalty denylist; scripts/ci/unindexed-fks.sql requires a usable
# index behind every foreign key.

on:
  push:
    branches: [main, 'refactor/**', 'feat/**', 'fix/**', 'hotfix/**', 'chore/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
  COMPOSER_NO_INTERACTION: "1"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      php: ${{ steps.plan.outputs.php }}
      node: ${{ steps.plan.outputs.node }}
      docker: ${{ steps.plan.outputs.docker }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Filter paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            php:
              - "**/*.php"
              - "composer.json"
              - "phpstan*"
              - "pint.json"
              - "rector.php"
              - "phpunit.xml*"
              - "testbench.yaml"
            node:
              - "package.json"
              - "package-lock.json"
              - "packages/**/package.json"
              - "packages/**/*.{js,mjs,cjs,ts,tsx,vue,json}"
              - "e2e/package.json"
              - "e2e/package-lock.json"
            docker:
              - "**/Dockerfile*"
              - "docker-compose*.yml"
            e2e:
              - "e2e/**"
              - "scripts/collab-e2e.sh"
              - "scripts/collab-stand.sh"
              - "packages/hub/test/e2e/**"
            workflows:
              - ".github/**"
              - "scripts/ci/**"

      - name: Plan lanes
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FILTER_PHP: ${{ steps.filter.outputs.php }}
          FILTER_NODE: ${{ steps.filter.outputs.node }}
          FILTER_DOCKER: ${{ steps.filter.outputs.docker }}
          FILTER_E2E: ${{ steps.filter.outputs.e2e }}
          FILTER_WORKFLOWS: ${{ steps.filter.outputs.workflows }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" || "$REF" == "refs/heads/main" || "$FILTER_WORKFLOWS" == "true" || -z "$FILTER_PHP" ]]; then
            full=true; php=true; node=true; docker=true; e2e=true
          else
            full=false
            php=${FILTER_PHP:-false}
            node=${FILTER_NODE:-false}
            docker=${FILTER_DOCKER:-false}
            e2e=${FILTER_E2E:-false}
          fi
          {
            echo "full=$full"
            echo "php=$php"
            echo "node=$node"
            echo "docker=$docker"
            echo "e2e=$e2e"
          } >> "$GITHUB_OUTPUT"
          echo "lanes full=$full php=$php node=$node docker=$docker e2e=$e2e"

  quality:
    name: Quality (stop-cranes, Pint, PHPStan, Rector, hub check, workflow lint)
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.php == 'true' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stop-cranes
        run: |
          python3 scripts/ci/stop-cranes.py --root "$GITHUB_WORKSPACE"
          python3 scripts/ci/stop-cranes.py --self-test

      - name: Lint workflows
        uses: ./.github/actions/lint-workflows

      - name: Check out the sibling repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Setup PHP and Composer
        uses: ./.github/actions/setup-php
        with:
          php-version: "8.4"
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-version --strict

      - name: Pint
        run: composer lint:check

      - name: PHPStan
        run: composer analyse

      - name: Rector (dry run)
        run: composer refactor:check

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: "26.13.1"

      - name: Assert the engines range
        run: node -e 'const e = require("./package.json").engines ?? {}; if (e.node !== ">=26.13.1") { console.error(e); process.exit(1) }'

      - name: Hub check
        run: npm run check:hub

      - name: Quality summary
        if: always()
        run: |
          {
            echo "## Quality"
            echo
            echo "Stop-cranes, composer validate, Pint, PHPStan, Rector, hub check, actionlint and zizmor ran on PHP 8.4 / Node 26.13.1."
          } >> "$GITHUB_STEP_SUMMARY"

  php:
    name: PHP ${{ matrix.php }} / PostgreSQL ${{ matrix.postgres }}
    needs: [changes, quality]
    if: always() && needs.quality.result == 'success' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.php == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        postgres: ['18.7', '19.0']
        php: ['8.4', '8.5']
    services:
      postgres:
        image: ${{ matrix.postgres == '18.7' && 'postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71' || 'postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188' }}
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: vaulter
          POSTGRES_DB: vaulter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: vaulter
      PGPASSWORD: vaulter
      PGDATABASE: vaulter_test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: vaulter_test
      DB_USERNAME: vaulter
      DB_PASSWORD: vaulter
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the sibling repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Setup PHP and Composer
        uses: ./.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3, pcntl, posix
          coverage: ${{ matrix.php == '8.4' && matrix.postgres == '18.7' && 'pcov' || 'none' }}

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Assert PostgreSQL ${{ matrix.postgres }}
        env:
          EXPECTED: ${{ matrix.postgres }}
        run: |
          ver=$(psql -tAc 'SHOW server_version')
          ver=${ver//[[:space:]]/}
          echo "server_version=${ver}"
          case "${ver}" in
            "${EXPECTED}"*) ;;
            *) echo "expected PostgreSQL ${EXPECTED}, got ${ver}" >&2; exit 1 ;;
          esac

      - name: Migrate and check that every foreign key is indexed
        env:
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: pgsql
        run: |
          vendor/bin/testbench migrate --force
          psql -v ON_ERROR_STOP=1 -f scripts/ci/unindexed-fks.sql

      # Engine-independent tests; once per PHP version is enough.
      - name: Pest (SQLite)
        if: matrix.postgres == '18.7'
        run: composer test -- --parallel

      - name: Pest (PostgreSQL, parallel pass and serial race scenarios, nothing skipped)
        env:
          WITH_COVERAGE: ${{ matrix.php == '8.4' && matrix.postgres == '18.7' && '1' || '0' }}
        run: |
          psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          if [[ "$WITH_COVERAGE" == 1 ]]; then
            mkdir -p build/coverage
            scripts/test-db.sh pgsql --coverage --coverage-clover build/coverage/clover.xml
          else
            scripts/test-db.sh pgsql
          fi

      - name: Upload coverage
        if: matrix.php == '8.4' && matrix.postgres == '18.7'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-php-pgsql
          path: build/coverage/clover.xml
          if-no-files-found: warn
          retention-days: 14

  mysql:
    name: PHP 8.4 / MySQL 9.7
    # The log reads take row locks only on MySQL (UpdateLog), the lease column is TIMESTAMP(6) there and the
    # schema has MySQL-only DDL (CollaborationSchema), so the engine needs its own lane. The forked race
    # scenarios (group serial) are PostgreSQL-only (ForkRace) and do not run here.
    needs: [changes, quality]
    if: always() && needs.quality.result == 'success' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.php == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:9.7@sha256:df90258da46f6e7ff8574ff84f17618aba0765cac749928299c69fd4e7cb8ad8
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: vaulter_test
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: vaulter_test
      DB_USERNAME: root
      DB_PASSWORD: secret
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the sibling repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Setup PHP and Composer
        uses: ./.github/actions/setup-php
        with:
          php-version: "8.4"
          extensions: pdo_mysql, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none

      - name: Pest (MySQL, parallel, nothing skipped)
        run: scripts/test-db.sh mysql

  node:
    name: Node (hub, Vue adapter)
    needs: [changes, quality]
    if: always() && needs.quality.result == 'success' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.php == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # @vaulter/vue-collaboration builds against ../vaulter/packages/vue (a file: dependency).
      - name: Check out the sibling repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: "26.13.1"
          install: "false"

      - name: Build sibling @vaulter/vue
        run: scripts/ci/build-sibling-vue.sh

      - name: Install npm dependencies
        run: npm ci

      - name: Hub tests
        run: npm run test:hub

      - name: Vue adapter tests and build
        run: npm run test:vue && npm run build:vue

  image-template:
    name: Node image template and hub image
    needs: [changes, quality]
    if: always() && (needs.quality.result == 'success' || needs.quality.result == 'skipped') && (needs.changes.outputs.full == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.node == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Node 26.13.1 template
        run: docker build --pull --build-arg SERVICE_PORT=1234 -t vaulter-node-template:ci .

      - name: Build collaboration hub image
        run: docker build --pull -t vaulter-collaboration-hub:ci packages/hub

      - name: Smoke test collaboration hub image
        run: docker run --rm --entrypoint node vaulter-collaboration-hub:ci -e "process.exit(0)"

  e2e:
    name: E2E (restore-epoch, command-crash, Playwright variants)
    needs: [changes, quality]
    if: always() && needs.quality.result == 'success' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.php == 'true' || needs.changes.outputs.node == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the sibling repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: "26.13.1"
          install: "false"
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Build sibling @vaulter/vue
        run: scripts/ci/build-sibling-vue.sh

      - name: Install Node runtime libraries (libatomic1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1 libstdc++6
          node -e "process.exit(0)"

      - name: Setup PHP and Composer
        uses: ./.github/actions/setup-php
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none

      - name: Install npm dependencies and Playwright Chromium
        run: |
          npm ci
          npm --prefix e2e ci
          npx --prefix e2e playwright install --with-deps chromium

      - name: Run collab E2E suite
        run: bash scripts/collab-e2e.sh

  stand:
    name: Docker stand (two hubs, kill-after-retry, sigterm-drain)
    needs: [changes, quality]
    if: always() && needs.quality.result == 'success' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.php == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Laravel host of the stand mounts this checkout with its vendor/ and the siblings next to it.
      - name: Check out the sibling repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Setup PHP and Composer
        uses: ./.github/actions/setup-php
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: "26.13.1"

      - name: Install Node runtime libraries (libatomic1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1 libstdc++6
          node -e "process.exit(0)"

      - name: Run stand scenarios
        run: bash scripts/collab-stand.sh

  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, quality, php, mysql, node, image-template, e2e, stand]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          lines = [f"- `{name}`: {job['result']}" for name, job in sorted(needs.items())]
          failed = {name: job["result"] for name, job in needs.items() if job["result"] not in ("success", "skipped")}
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## CI gate\n\n")
                  fh.write("\n".join(lines) + "\n")
                  if failed:
                      fh.write("\nA skipped lane is allowed when the path filter dropped it; failed or cancelled jobs are not.\n")
          for name, result in sorted(failed.items()):
              print(f"::error::{name}: {result}")
          if failed:
              sys.exit(1)
          print("all required jobs succeeded or were skipped")
          PY
