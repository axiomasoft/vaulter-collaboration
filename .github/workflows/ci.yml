name: CI

# Same skeleton as the other Vaulter satellites: quality (static checks and stop-cranes), php (PHP x PostgreSQL), mysql,
# node (hub and Vue adapter), the product lanes (images, e2e, stand) and one required `CI gate`.
#
# The siblings (../vaulter, ../packman) come from scripts/ci/checkout-ecosystem.sh with the VAULTER_READ_TOKEN
# secret. The stop-cranes (scripts/ci/stop-cranes.py) enforce the Zero-Royalty denylist and the source bans a text
# scan can see; their --self-test proves a forbidden tree fails. scripts/ci/unindexed-fks.sql is the catalog gate
# shared with the base repository: every foreign key must be backed by a usable index.

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
  COMPOSER_NO_INTERACTION: "1"

jobs:
  quality:
    name: Quality (stop-cranes, Pint, PHPStan, Rector)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stop-cranes
        run: |
          python3 scripts/ci/stop-cranes.py --root "$GITHUB_WORKSPACE"
          python3 scripts/ci/stop-cranes.py --self-test

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Check out the sibling repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-quality-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
          restore-keys: composer-quality-

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-version --strict

      - name: Install Composer dependencies
        run: composer install --no-progress

      - name: Pint
        run: composer lint:check

      - name: PHPStan
        run: composer analyse

      - name: Rector (dry run)
        run: composer refactor:check

  php:
    name: PHP ${{ matrix.php }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres: ['18.7', '19.0']
        php: ['8.4', '8.5']
    services:
      postgres:
        image: ${{ matrix.postgres == '18.7' && 'postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71' || 'postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188' }}
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: vaulter
          POSTGRES_DB: vaulter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: vaulter
      PGPASSWORD: vaulter
      PGDATABASE: vaulter_test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: vaulter_test
      DB_USERNAME: vaulter
      DB_PASSWORD: vaulter
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Check out the sibling repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-php${{ matrix.php }}-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
          restore-keys: composer-php${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-progress

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Assert PostgreSQL ${{ matrix.postgres }}
        run: |
          ver=$(psql -tAc 'SHOW server_version')
          ver=${ver//[[:space:]]/}
          echo "server_version=${ver}"
          case "${ver}" in
            "${{ matrix.postgres }}"*) ;;
            *) echo "expected PostgreSQL ${{ matrix.postgres }}, got ${ver}" >&2; exit 1 ;;
          esac

      - name: Migrate and check that every foreign key is indexed
        env:
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: pgsql
        run: |
          vendor/bin/testbench migrate --force
          psql -v ON_ERROR_STOP=1 -f scripts/ci/unindexed-fks.sql

      # Engine-independent tests; once per PHP version is enough.
      - name: Pest (SQLite)
        if: matrix.postgres == '18.7'
        run: composer test -- --parallel

      - name: Pest (PostgreSQL, parallel pass and serial race scenarios, nothing skipped)
        run: |
          psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          scripts/test-db.sh pgsql

  mysql:
    name: PHP 8.4 / MySQL 9.7
    # The log reads take row locks only on MySQL (UpdateLog), the lease column is TIMESTAMP(6) there and the
    # schema has MySQL-only DDL (CollaborationSchema), so the engine needs its own lane. The forked race
    # scenarios (group serial) are PostgreSQL-only (ForkRace) and do not run here.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:9.7@sha256:df90258da46f6e7ff8574ff84f17618aba0765cac749928299c69fd4e7cb8ad8
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: vaulter_test
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: vaulter_test
      DB_USERNAME: root
      DB_PASSWORD: secret
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Check out the sibling repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-php8.4-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
          restore-keys: composer-php8.4-

      - name: Install Composer dependencies
        run: composer install --no-progress

      - name: Pest (MySQL, parallel, nothing skipped)
        run: scripts/test-db.sh mysql

  node:
    name: Node (hub, Vue adapter)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # @vaulter/vue-collaboration builds against ../vaulter/packages/vue (a file: dependency).
      - name: Check out the sibling repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm

      - name: Assert the engines range
        run: node -e 'const e = require("./package.json").engines ?? {}; if (e.node !== ">=26.13.1") { console.error(e); process.exit(1) }'

      - name: Install npm dependencies
        run: npm ci

      - name: Hub check and tests
        run: npm run check:hub && npm run test:hub

      - name: Vue adapter tests and build
        run: npm run test:vue && npm run build:vue

  image-template:
    name: Node image template and hub image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Node 26.13.1 template
        run: docker build --pull --build-arg SERVICE_PORT=1234 -t vaulter-node-template:ci .

      - name: Build collaboration hub image
        run: docker build --pull -t vaulter-collaboration-hub:ci packages/hub

      - name: Smoke test collaboration hub image
        run: docker run --rm --entrypoint node vaulter-collaboration-hub:ci -e "process.exit(0)"

  e2e:
    name: E2E (restore-epoch, command-crash, Playwright variants)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the sibling repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install Node runtime libraries (libatomic1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1 libstdc++6
          node -e "process.exit(0)"

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Install dependencies and Playwright Chromium
        run: |
          composer install --no-progress
          npm ci
          npm --prefix e2e ci
          npx --prefix e2e playwright install --with-deps chromium

      - name: Run collab E2E suite
        run: bash scripts/collab-e2e.sh

  stand:
    name: Docker stand (two hubs, kill-after-retry, sigterm-drain)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Laravel host of the stand mounts this checkout with its vendor/ and the siblings next to it.
      - name: Check out the sibling repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm

      - name: Install Node runtime libraries (libatomic1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1 libstdc++6
          node -e "process.exit(0)"

      - name: Install dependencies
        run: |
          composer install --no-progress
          npm ci

      - name: Run stand scenarios
        run: bash scripts/collab-stand.sh

  ci-gate:
    name: CI gate
    if: always()
    needs: [quality, php, mysql, node, image-template, e2e, stand]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = {name: job["result"] for name, job in needs.items() if job["result"] != "success"}
          for name, result in sorted(failed.items()):
              print(f"::error::{name}: {result}")
          sys.exit(1 if failed else 0)
          PY
