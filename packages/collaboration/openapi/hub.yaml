    HubAuthenticated:
      type: object
      required:
      - allowed
      - mode
      - userId
      properties:
        allowed:
          type: boolean
        mode:
          type: string
          enum:
          - ro
          - rw
        userId:
          type:
          - string
          - 'null'
        epoch:
          type: integer
    HubAppended:
      type: object
      description: The committed receipt of an appended update (protocol 2), sent only after the commit.
      required:
      - generation
      - update_id
      - seq
      - sha256
      - persisted
      - permissions_stale
      properties:
        generation:
          type: integer
        update_id:
          type: string
        seq:
          type: integer
        sha256:
          type: string
        persisted:
          type: boolean
          const: true
        permissions_stale:
          type: boolean
          description: True when the token predates a change of its drive's or of every drive's permissions. The append
            was allowed by the rights now; the hub renews the token.
    HubPermissionsVersion:
      type: object
      description: The permission versions of the token's drive and of every drive.
      required:
      - drive
      - global
      properties:
        drive:
          type: integer
          minimum: 0
        global:
          type: integer
          minimum: 0
    HubRenewed:
      type: object
      description: A renewed room token, scoped by the rights now.
      required:
      - token
      - room
      - generation
      - scope
      - mode
      - exp
      - jti
      - permissions_version
      properties:
        token:
          type: string
        room:
          type: string
        generation:
          type: integer
        scope:
          type: string
          enum:
          - read
          - write
        mode:
          type: string
          enum:
          - ro
          - rw
        exp:
          type: integer
          description: Unix seconds, hub.token_ttl from the renewal.
        jti:
          type: string
        permissions_version:
          $ref: '#/components/schemas/HubPermissionsVersion'
    HubRecheck:
      type: object
      description: What each connection of a recheck may do now, in the order of the request.
      required:
      - results
      properties:
        results:
          type: array
          items:
            type: object
            required:
            - id
            - access
            - reason
            - jti
            properties:
              id:
                type: string
              access:
                type: string
                enum:
                - none
                - read
                - write
              reason:
                type:
                - string
                - 'null'
                description: 'Why access is none: token (invalid or expired), gone, generation, unavailable or revoked; null
                  otherwise.'
              jti:
                type:
                - string
                - 'null'
    HubCompactionLease:
      type: object
      description: 'A compaction lease on one document generation and what the hub merges under it, read with the lease under
        the document and head locks: the checkpoint (null before the first one, then content is the JSON to seed from) and
        the tail (checkpoint_seq, head_seq].'
      required:
      - document
      - generation
      - lease_token
      - lease_expires_at
      - checkpoint_seq
      - head_seq
      - checkpoint_version
      - type
      - schema_version
      - protocol
      - state_format
      - checkpoint
      - content
      - tail
      properties:
        document:
          type: string
          description: The node id of the document.
        generation:
          type: integer
        lease_token:
          type: string
        lease_expires_at:
          type: string
          format: date-time
        checkpoint_seq:
          type: integer
        head_seq:
          type: integer
        checkpoint_version:
          type: integer
          description: The state version the publication must expect (expected_checkpoint_version).
        type:
          type: string
        protocol:
          type: string
        state_format:
          type: string
        schema_version:
          type: integer
        checkpoint:
          type:
          - string
          - 'null'
          description: Base64 Yjs checkpoint, null before the first one.
        content:
          type:
          - object
          - 'null'
        tail:
          type: array
          items:
            type: object
            required:
            - seq
            - update_id
            - payload
            properties:
              seq:
                type: integer
              update_id:
                type: string
              payload:
                type: string
                description: Base64 Yjs update.
    HubCheckpointPublished:
      type: object
      description: A published checkpoint. marker_cleared is false when edits committed after the lease read the log keep
        the document pending; their updates stay in the log.
      required:
      - checkpoint_version
      - marker_cleared
      properties:
        checkpoint_version:
          type: integer
        marker_cleared:
          type: boolean
    HubLoadedV2:
      type: object
      description: 'Protocol 2 load: the checkpoint and the committed tail (checkpoint_seq, head_seq] to replay on it. Before
        the first checkpoint, content is the JSON projection to seed the room from.'
      required:
      - generation
      - schema_version
      - protocol
      - state_format
      - type
      - state_version
      - checkpoint
      - checkpoint_seq
      - head_seq
      - content
      - tail
      properties:
        generation:
          type: integer
        protocol:
          type: string
        state_format:
          type: string
        schema_version:
          type: integer
        type:
          type: string
        state_version:
          type: integer
        checkpoint:
          type:
          - string
          - 'null'
          description: Base64 Yjs checkpoint, null before the first one.
        checkpoint_seq:
          type: integer
        head_seq:
          type: integer
        content:
          type:
          - object
          - 'null'
        tail:
          type: array
          items:
            type: object
            required:
            - seq
            - update_id
            - payload
            properties:
              seq:
                type: integer
              update_id:
                type: string
              payload:
                type: string
                description: Base64 Yjs update.
